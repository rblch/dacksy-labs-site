<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare designs · Dacksy Labs</title>
  <link rel="stylesheet" href="assets/compare.css">
</head>
<body>
  <header class="shell">
    <p>Dacksy Labs</p>
    <a class="current" href="index.html?variation=original">Original saturated design</a>
  </header>
  <main class="shell">
    <h1>Compare designs</h1>
    <div class="choices">
      <article>
        <div class="preview">
          <iframe src="index.html?variation=minimal" title="Minimal design preview" tabindex="-1" aria-hidden="true"></iframe>
        </div>
        <div class="caption">
          <h2>Minimal</h2>
          <p>White cards, fine outlines, and quiet typography.</p>
          <a class="open" href="index.html?variation=minimal" aria-label="Open Minimal preview">Open preview</a>
        </div>
      </article>
      <article>
        <div class="preview">
          <iframe src="index.html?variation=overprint" title="Overprint design preview" tabindex="-1" aria-hidden="true"></iframe>
        </div>
        <div class="caption">
          <h2>Overprint</h2>
          <p>Cobalt, raspberry, and yellow with offset ink borders.</p>
          <a class="open" href="index.html?variation=overprint" aria-label="Open Overprint preview">Open preview</a>
        </div>
      </article>
      <article>
        <div class="preview">
          <iframe src="index.html?variation=gallery" title="Gallery design preview" tabindex="-1" aria-hidden="true"></iframe>
        </div>
        <div class="caption">
          <h2>Gallery</h2>
          <p>Upright cards with bold color panels and room between them.</p>
          <a class="open" href="index.html?variation=gallery" aria-label="Open Gallery preview">Open preview</a>
        </div>
      </article>
    </div>
  </main>
  <script src="assets/compare.js"></script>
</body>
</html>
