<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="Explore the apps made by Dacksy Labs.">
  <title>Draft: Still developing · Dacksy Labs</title>
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="develop.css">
</head>
<body>
  <header class="header shell">
    <a class="brand" href="../index.html" aria-label="Dacksy Labs home">Dacksy Labs</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../about.html">About</a>
      <a href="../contact.html">Contact</a>
      <a href="../impressum.html">Impressum</a>
    </nav>
  </header>

  <main class="home">
    <h1 class="sr-only">Dacksy Labs</h1>
    <h2 class="sr-only" id="projects-title">Projects</h2>
    <ul class="deck" id="deck" tabindex="0" aria-labelledby="projects-title" aria-keyshortcuts="ArrowLeft ArrowRight">
      <li class="project project--dackel" data-slot="left"
          data-url="https://dackelapp.com/"
          data-description="A native Markdown editor for Mac and iOS, built for scientists, students, professionals, and creative writers.">
        <button class="project-card" type="button" aria-haspopup="dialog" aria-label="Dackel">
          <img class="project-art" src="../assets/dackel-mascot.png" alt="" width="424" height="239" draggable="false">
          <span class="project-caption"><span class="project-name">Dackel</span></span>
        </button>
      </li>
      <li class="project project--coral" data-slot="center" data-description="Still developing. Check back soon.">
        <button class="project-card is-soon" type="button" aria-haspopup="dialog" aria-label="Coral coming-soon card">
          <span class="project-caption"><span class="project-name">Coming soon</span></span>
        </button>
      </li>
      <li class="project project--lilac" data-slot="right" data-description="Still developing. Check back soon.">
        <button class="project-card is-soon" type="button" aria-haspopup="dialog" aria-label="Lilac coming-soon card">
          <span class="project-caption"><span class="project-name">Coming soon</span></span>
        </button>
      </li>
    </ul>
    <p class="sr-only" id="deck-status" aria-live="polite"></p>
  </main>

  <dialog class="project-dialog" id="project-details" aria-labelledby="project-details-title" aria-describedby="project-details-copy">
    <div class="project-flip">
      <div class="project-flip-front" inert aria-hidden="true"></div>
      <div class="project-flip-back">
        <div class="project-back-art" hidden><img alt="" draggable="false"></div>
        <div class="project-back-copy">
          <h2 id="project-details-title" tabindex="-1" autofocus></h2>
          <p id="project-details-copy" hidden></p>
          <a class="button" id="project-visit" hidden>Visit Dackel</a>
        </div>
      </div>
    </div>
  </dialog>

  <script src="../assets/site.js"></script>
</body>
</html>
