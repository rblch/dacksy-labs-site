# Publishes the built site to GitHub Pages on every push to main.
# Only the public files are uploaded: src/, i18n/, build.py and tooling stay out.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the built pages are up to date
        run: |
          python3 build.py
          git diff --exit-code || { echo "::error::Run python3 build.py and commit the result."; exit 1; }

      - name: Collect public files
        run: |
          mkdir _site
          cp -R *.html robots.txt assets es de _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
